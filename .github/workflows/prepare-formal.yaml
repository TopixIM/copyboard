name: Protected Copyboard formal source migration
on:
  push:
    branches: [prepare/copyboard-formal-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          caps --strict --ci
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          caps verify --toolchain
          node prepare-source.mjs apply
      - name: Original strict, canonical, namespace, native and dynamic method gates
        run: |
          set -euo pipefail
          calcit calcit.cirru fix --workflow strict --verify --format json | tee acceptance/strict.json
          yarn check
          calcit calcit.cirru edit transaction --code '[["edit","format"]]' --dry-run --format json | jq -e '.changed == false'
          calcit calcit.cirru --entry server test --require-match --summary-only --format json | tee acceptance/native.json
          calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry server analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
      - name: Original native HTTP and WebSocket business smoke with synthetic storage
        env:
          port: "11006"
        run: |
          set -euo pipefail
          test ! -e storage.cirru
          node scripts/smoke-native-server.mjs 2>&1 | tee acceptance/smoke.log
      - uses: actions/checkout@v7.0.1
        with:
          repository: calcit-lang/calcit
          ref: 0.30.1
          path: .calcit/core-test-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/run-core-tests.mjs
            /scripts/core-test-protocol.mjs
            /scripts/core-tests-exclusions.cirru
            /docs/installation/wasm-support.md
      - name: Replay original deletion test on native and JS
        run: |
          set -euo pipefail
          export CALCIT_BIN="$(command -v calcit)"
          node .calcit/core-test-tools/scripts/run-core-tests.mjs \
            --snapshot calcit.cirru --entry server --target app.updater.snippet/remove-one --backend native,js \
            --exclusions .calcit/core-test-tools/scripts/core-tests-exclusions.cirru \
            --support-matrix .calcit/core-test-tools/docs/installation/wasm-support.md \
            --results-json acceptance/shared.json 2>&1 | tee acceptance/shared.log
      - name: Original frontend build and complete after guards
        env:
          VITE_BASE_URL: ./
        run: |
          set -euo pipefail
          yarn compile-page
          yarn release-page
          node prepare-source.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: copyboard-formal-accepted-source
          path: |
            calcit.cirru
            yarn.lock
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: copyboard-formal-diagnostics
          path: acceptance
          if-no-files-found: error
          retention-days: 30
