name: Try to upload

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@v1

    - run: |
        caps --ci
        caps reset
        caps verify
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru --entry server --check-only

    - name: Smoke-test native server
      run: |
        calcit calcit.cirru --entry server > server.log 2>&1 &
        server_pid=$!
        cleanup() {
          status=$?
          if kill -0 "$server_pid" 2>/dev/null; then
            kill "$server_pid" || true
          fi
          if [ "$status" -ne 0 ]; then
            cat server.log || true
          fi
          exit "$status"
        }
        trap cleanup EXIT
        for _ in {1..20}; do
          if curl --fail --silent http://127.0.0.1:11030/ > /dev/null; then
            break
          fi
          sleep 1
        done
        curl --fail --silent --show-error http://127.0.0.1:11030/ > /dev/null
        node --input-type=module -e '
          const payload = Buffer.from("Cjo6ICd1c2VyL2xvZy1pbiAkIFtdIHxjaGVuIHxiYWQtcGFzc3dvcmQK", "base64").toString();
          await new Promise((resolve, reject) => {
            const ws = new WebSocket("ws://127.0.0.1:11006");
            let loginSent = false;
            const timeout = setTimeout(() => reject(new Error("WebSocket login response timeout")), 10000);
            ws.addEventListener("open", () => setTimeout(() => {
              loginSent = true;
              ws.send(payload);
            }, 500));
            ws.addEventListener("message", () => {
              if (loginSent) {
                clearTimeout(timeout);
                ws.close();
                resolve();
              }
            });
            ws.addEventListener("error", (event) => {
              clearTimeout(timeout);
              reject(event.error || new Error("WebSocket error"));
            });
          });
        '
        kill -0 "$server_pid"

    - run: yarn install --immutable && yarn compile-page && yarn release-page

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: copyboard-dist
        path: dist
        if-no-files-found: error
        retention-days: 3

    - run: mkdir -p dist-server && cp calcit.cirru package.json deps.cirru dist-server
      name: Copy server scripts

    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Upload server script
      id: deploy-server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist-server/*'
        dest: 'rsync-user@tiye.me:/servers/copyboard/'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-server.outputs.status }}"
