name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate
        yarn --version

    - name: Install and validate dependencies
      run: |
        caps --ci
        yarn install --immutable
        caps verify --toolchain

    - name: Validate Calcit snapshot and types
      run: |
        yarn check
        calcit calcit.cirru edit transaction --code '[["edit","format"]]' --dry-run --format json | jq -e '.changed == false'
        calcit calcit.cirru --entry server test --require-match
        calcit calcit.cirru analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
        calcit calcit.cirru --entry server analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'

    - name: Smoke-test native server
      run: node scripts/smoke-native-server.mjs

    - name: Build client with CDN asset URLs
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${{ github.event.pull_request.number }}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/"
        fi
        export VITE_BASE_URL="${CDN_ORIGIN}/${asset_prefix}"
        echo "VITE_BASE_URL=${VITE_BASE_URL}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${VITE_BASE_URL}" >> "$GITHUB_OUTPUT"
        yarn compile-page
        yarn release-page

    - run: mkdir -p dist-server && cp -v calcit.cirru deps.cirru package.json dist-server/
      name: Copy server scripts

    - name: Upload static assets to COS
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      timeout-minutes: 10
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.asset-path.outputs.prefix }}
        public-base-url: ${{ steps.asset-path.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Upload web assets
      id: deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"

    - name: Upload server script
      id: deploy-server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist-server/*'
        dest: 'rsync-user@tiye.me:/servers/copyboard/'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-server.outputs.status }}"
